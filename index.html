<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <button id="theme-toggle" class="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">🌙</button>
      <h1 class="game-title">TETRIS</h1>
      <div class="game-container">
        <canvas id="board" width="300" height="600"></canvas>

        <aside class="panel">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>

          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="120" height="120"></canvas>
          </div>

          <div class="panel-section">
            <label class="label" for="skin-select">Skin</label>
            <select id="skin-select">
              <option value="retro">Retro</option>
              <option value="neon">Neon</option>
              <option value="pastel">Pastel</option>
              <option value="pixel">Pixel art</option>
            </select>
          </div>

          <div class="panel-section controls">
            <span class="label">CONTROLS</span>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> pausa</li>
            </ul>
          </div>
        </aside>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>
            <p id="hs-badge" class="hs-badge hidden">¡Nuevo récord!</p>
            <div id="hs-form" class="hs-form hidden">
              <input type="text" id="hs-name" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
              <button type="button" id="hs-save">Guardar</button>
            </div>
            <div id="over-scores" class="hs-scores"></div>
            <button type="button" id="restart-btn">Reiniciar</button>
            <button type="button" class="clear-scores-btn">Borrar récords</button>
          </div>
        </div>

        <div id="start-screen" class="overlay">
          <div class="overlay-box">
            <p id="start-title">TETRIS</p>
            <p class="hs-heading">Mejores puntuaciones</p>
            <div id="start-scores" class="hs-scores"></div>
            <button type="button" id="play-btn">Jugar</button>
            <button type="button" class="clear-scores-btn">Borrar récords</button>
          </div>
        </div>

        <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
          <div class="overlay-box">
            <p id="pause-title" class="pause-title">PAUSA</p>
            <button type="button" id="resume-btn" class="menu-btn">Reanudar</button>
            <button type="button" id="pause-restart-btn" class="menu-btn">Reiniciar</button>
            <button type="button" id="controls-btn" class="menu-btn">Ver controles</button>
            <ul id="pause-controls" class="pause-controls hidden">
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd>/<kbd>X</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
            </ul>
            <label class="level-select">Nivel inicial
              <select id="start-level"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>
            </label>
          </div>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
